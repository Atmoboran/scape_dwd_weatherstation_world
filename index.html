<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#F2E4BA" />
<title>SCAPE° — Wetterstationen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FFED00'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial' font-size='19' text-anchor='middle' fill='%23000'%3ES%C2%B0%3C/text%3E%3C/svg%3E" />
<style>
  /* No colour, font or copy is defined here - the active theme supplies every token
     via src/theme.js, so restyling the app means swapping a theme module. */
  :root { --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--overlay-bg);
    font-family: var(--font); color: var(--panel-text); overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }
  .hidden { display: none !important; }

  .panel {
    background: var(--panel-bg); border: 1px solid var(--stroke);
    border-radius: var(--radius); backdrop-filter: var(--blur);
  }
  .label {
    font-size: 10px; letter-spacing: var(--letter-spacing-label);
    text-transform: uppercase; color: var(--panel-muted);
  }

  /* ---------- brand ---------- */
  .wordmark { font-weight: 400; letter-spacing: -0.01em; line-height: 0.95; }
  .subtitle {
    display: flex; justify-content: space-between; width: 100%;
    font-size: 0.26em; font-weight: 500; letter-spacing: 0.04em; margin-top: 0.12em;
  }

  #brand-mark {
    position: absolute; top: calc(12px + var(--safe-t)); left: 12px;
    background: var(--mark-bg); color: var(--mark-text); border-radius: var(--radius);
    width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 500;
  }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  #progress {
    position: absolute; top: calc(58px + var(--safe-t)); left: 12px;
    padding: 8px 12px; min-width: 136px;
  }
  #progress .count { font-size: 19px; font-weight: 500; margin-top: 1px; }
  #progress .count small { font-size: 12px; color: var(--panel-muted); }
  #progress .pips { display: flex; gap: 3px; margin-top: 6px; }
  #progress .pip { width: 12px; height: 4px; background: var(--pip-off); }

  #minimap-wrap { position: absolute; top: calc(12px + var(--safe-t)); right: 12px; padding: 6px; }
  #minimap { display: block; width: 104px; height: 104px; }

  #settings-btn {
    position: absolute; top: calc(130px + var(--safe-t)); right: 12px;
    width: 46px; height: 46px; pointer-events: auto; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    color: var(--panel-text);
  }
  #settings-panel {
    position: absolute; top: calc(184px + var(--safe-t)); right: 12px;
    width: 182px; padding: 12px; pointer-events: auto;
    opacity: 0; transform: translateY(-6px); transform-origin: top right; visibility: hidden;
    transition: opacity 0.16s, transform 0.16s;
  }
  #settings-panel.open { opacity: 1; transform: none; visibility: visible; }
  #settings-panel .label { margin-bottom: 9px; }
  #weather-options { display: flex; flex-direction: column; gap: 4px; }
  #weather-options button {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px;
    border: 1px solid transparent; border-radius: var(--radius); background: var(--chip-bg);
    color: var(--panel-text); font: inherit; font-size: 13.5px; cursor: pointer; text-align: left;
  }
  #weather-options button.active { background: var(--accent); border-color: var(--stroke-strong); }

  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%; background: var(--crosshair);
    box-shadow: 0 0 0 1.5px var(--crosshair-ring); opacity: 0; transition: opacity 0.2s;
  }
  body.locked #crosshair { opacity: 1; }

  #station-label {
    position: absolute; left: 50%; top: 24%; transform: translateX(-50%);
    text-align: center; opacity: 0; transition: opacity 0.18s;
    background: var(--panel-bg); border-radius: var(--radius); padding: 6px 14px;
    max-width: calc(100% - 24px);
  }
  #station-label.visible { opacity: 1; }
  #station-label .name { font-size: 16px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.02em; }
  #station-label .dist { font-size: 12px; color: var(--panel-muted); }

  #interact {
    position: absolute; left: 50%; bottom: calc(26% + var(--safe-b)); transform: translateX(-50%);
    background: var(--accent); color: var(--accent-text); border: 1px solid var(--stroke-strong);
    border-radius: var(--radius); padding: 10px 20px; font-size: 14px; font-weight: 500;
    letter-spacing: 0.04em; pointer-events: auto; opacity: 0; transition: opacity 0.18s;
    display: flex; align-items: center; gap: 8px; cursor: pointer;
  }
  #interact.visible { opacity: 1; }
  #interact kbd {
    background: var(--chip-bg); border: 1px solid var(--stroke); border-radius: var(--radius);
    padding: 1px 6px; font: inherit; font-size: 12px;
  }

  #toast-stack {
    position: absolute; left: 50%; bottom: calc(42% + var(--safe-b)); transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  .toast {
    background: var(--panel-bg); border: 1px solid var(--stroke); border-left: 4px solid var(--accent);
    border-radius: var(--radius); padding: 9px 16px; font-size: 14px; white-space: nowrap;
    animation: toast-in 0.26s ease both; backdrop-filter: var(--blur);
  }
  .toast.out { animation: toast-out 0.4s ease both; }
  .toast .sub { color: var(--panel-muted); font-size: 12px; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(-8px); } }

  /* ---------- touch controls ---------- */
  #touch-controls { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  body:not(.touch) #touch-controls { display: none; }

  #joystick-zone, #look-zone {
    position: absolute; bottom: 0; height: 58%; pointer-events: auto; touch-action: none;
  }
  #joystick-zone { left: 0; width: 46%; }
  #look-zone { right: 0; width: 54%; }

  #joystick {
    position: absolute; left: 26px; bottom: calc(30px + var(--safe-b));
    width: 116px; height: 116px; border-radius: 50%;
    background: var(--touch-fill); border: 1.5px solid var(--touch-stroke); pointer-events: none;
  }
  #joystick-knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: var(--touch-knob); transition: transform 0.06s linear;
  }
  #joystick-hint, #look-hint {
    position: absolute; font-size: 11px; color: var(--touch-text);
    letter-spacing: 0.06em; text-transform: uppercase; pointer-events: none;
    transition: opacity 0.5s; text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }
  #joystick-hint { left: 26px; bottom: calc(154px + var(--safe-b)); width: 116px; text-align: center; }
  #look-hint { right: 26px; bottom: calc(76px + var(--safe-b)); }
  .faded { opacity: 0 !important; }

  #sprint-btn {
    position: absolute; right: 22px; bottom: calc(112px + var(--safe-b));
    width: 62px; height: 62px; border-radius: 50%; pointer-events: auto;
    background: var(--touch-fill); border: 1.5px solid var(--touch-stroke);
    display: flex; align-items: center; justify-content: center; font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--touch-text);
  }
  #sprint-btn.active { background: var(--accent); color: var(--accent-text); border-color: var(--stroke-strong); }

  /* ---------- info panel ---------- */
  #info-panel {
    position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 110%);
    width: min(560px, 100%); background: var(--panel-bg-alt); z-index: 12;
    border: 1px solid var(--stroke); border-bottom: none;
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 18px 20px calc(22px + var(--safe-b));
    transition: transform 0.28s cubic-bezier(.2,.8,.3,1);
    max-height: 72vh; overflow-y: auto; box-shadow: var(--shadow); color: var(--panel-text);
  }
  #info-panel.open { transform: translate(-50%, 0); }
  #info-panel .accent-bar { height: 6px; background: var(--accent); margin-bottom: 14px; }
  #info-panel h2 {
    margin: 0 0 2px; font-size: 21px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.01em; line-height: 1.1;
  }
  #info-panel .source { font-size: 12px; color: var(--panel-muted); margin-bottom: 12px; }
  #info-panel p { margin: 0 0 14px; line-height: 1.55; font-size: 14.5px; }
  #info-panel .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  #info-panel .chip {
    font-size: 12px; padding: 4px 10px; background: var(--chip-bg);
    border: 1px solid var(--stroke); border-radius: var(--radius);
  }
  #info-panel .stats { display: flex; gap: 20px; font-size: 12px; color: var(--panel-muted); margin-bottom: 16px; }
  #info-panel .stats b { display: block; color: var(--panel-text); font-size: 15px; font-weight: 500; }
  #info-panel button {
    width: 100%; padding: 12px; border: 1px solid var(--stroke-strong); border-radius: var(--radius);
    background: var(--btn-bg); color: var(--btn-text); font: inherit; font-weight: 500;
    letter-spacing: 0.04em; cursor: pointer;
  }

  /* ---------- overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 20; background: var(--overlay-bg);
    color: var(--overlay-text); transition: opacity 0.45s;
  }
  .overlay.fade { opacity: 0; pointer-events: none; }
  .overlay .poster { position: absolute; inset: 0; overflow: hidden; }
  .overlay .poster svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .overlay .content {
    position: relative; height: 100%; display: flex; flex-direction: column;
    padding: calc(22px + var(--safe-t)) 24px calc(24px + var(--safe-b));
    overflow-y: auto;
  }

  .overlay .logo { font-size: clamp(30px, 9vw, 54px); width: max-content; max-width: 100%; }
  .overlay .spacer { flex: 1; min-height: 12px; }

  #start h1 {
    margin: 0; font-size: clamp(34px, 11vw, 72px); font-weight: var(--headline-weight);
    line-height: 0.92; letter-spacing: -0.015em; text-transform: uppercase;
  }
  #start .claim {
    margin: 14px 0 0; font-size: clamp(11px, 2.6vw, 14px); font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  #start .intro { margin: 10px 0 0; font-size: 15px; line-height: 1.5; max-width: 42ch; }
  #start .keys { display: flex; flex-direction: column; gap: 5px; margin: 18px 0 0; }
  #start .row { display: flex; align-items: baseline; gap: 10px; font-size: 13.5px; }
  #start .row .k {
    min-width: 74px; padding: 3px 7px; background: var(--chip-bg); border: 1px solid var(--stroke);
    border-radius: var(--radius); font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; text-align: center; flex: none;
  }
  #start .go {
    margin-top: 20px; padding: 15px 34px; border: 1px solid var(--stroke-strong);
    border-radius: var(--radius); cursor: pointer; background: var(--btn-bg); color: var(--btn-text);
    font: inherit; font-size: 17px; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; align-self: flex-start;
  }

  #loading .content { align-items: flex-start; }
  #loading .bar-track { width: min(260px, 100%); height: 8px; background: var(--bar-track); margin-top: 16px; }
  #loading .bar-fill { height: 100%; width: 0%; background: var(--bar-fill); transition: width 0.25s ease; }
  #loading .hint { font-size: 13px; color: var(--panel-muted); margin-top: 10px; }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="brand-mark" data-brand-mark></div>

    <div id="progress" class="panel">
      <div class="label" id="found-label"></div>
      <div class="count"><span id="found-count">0</span><small> / <span id="total-count">0</span></small></div>
      <div class="pips" id="pips"></div>
    </div>

    <div id="minimap-wrap" class="panel"><canvas id="minimap" width="208" height="208"></canvas></div>

    <button id="settings-btn" class="panel" type="button">&#9925;</button>
    <div id="settings-panel" class="panel">
      <div class="label" id="weather-title"></div>
      <div id="weather-options"></div>
    </div>

    <div id="crosshair"></div>

    <div id="station-label">
      <div class="name"></div>
      <div class="dist"></div>
    </div>

    <div id="toast-stack"></div>

    <div id="interact"><span class="verb"></span><kbd>E</kbd></div>
  </div>

  <div id="touch-controls">
    <div id="joystick-zone"></div>
    <div id="look-zone"></div>
    <div id="joystick"><div id="joystick-knob"></div></div>
    <div id="joystick-hint"></div>
    <div id="look-hint"></div>
    <div id="sprint-btn"></div>
  </div>

  <div id="info-panel">
    <div class="accent-bar"></div>
    <h2></h2>
    <div class="source"></div>
    <p></p>
    <div class="chips"></div>
    <div class="stats"></div>
    <button type="button"></button>
  </div>

  <div id="start" class="overlay hidden">
    <div class="poster" data-poster></div>
    <div class="content">
      <div class="logo">
        <div class="wordmark" data-brand-wordmark></div>
        <div class="subtitle" data-brand-subtitle></div>
      </div>
      <div class="spacer"></div>
      <h1 id="start-headline"></h1>
      <p class="claim" data-brand-claim></p>
      <p class="intro" id="start-intro"></p>
      <div class="keys" id="control-help"></div>
      <button class="go" type="button"></button>
      <div class="spacer"></div>
    </div>
  </div>

  <div id="loading" class="overlay">
    <div class="poster" data-poster></div>
    <div class="content">
      <div class="logo">
        <div class="wordmark" data-brand-wordmark></div>
        <div class="subtitle" data-brand-subtitle></div>
      </div>
      <div class="spacer"></div>
      <div class="bar-track"><div class="bar-fill" id="loading-bar"></div></div>
      <div class="hint" id="loading-hint"></div>
      <div class="spacer"></div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./assets/vendor/three/build/three.module.js",
      "three/addons/loaders/GLTFLoader.js": "./assets/vendor/three/examples/jsm/loaders/GLTFLoader.js",
      "three/addons/loaders/DRACOLoader.js": "./assets/vendor/three/examples/jsm/loaders/DRACOLoader.js",
      "three/addons/controls/PointerLockControls.js": "./assets/vendor/three/examples/jsm/controls/PointerLockControls.js",
      "three/addons/utils/BufferGeometryUtils.js": "./assets/vendor/three/examples/jsm/utils/BufferGeometryUtils.js"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
