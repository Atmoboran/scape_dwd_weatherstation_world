<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Meteo Instrument Walk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%235fb0ff'/%3E%3Ccircle cx='16' cy='14' r='7' fill='%23fff'/%3E%3Crect x='14' y='20' width='4' height='9' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0e14; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  #crosshair {
    position: fixed; top: 50%; left: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,0.6);
    pointer-events: none; z-index: 5; display: none;
  }
  body.desktop.locked #crosshair { display: block; }

  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: #0a0e14; color: #e8edf4; font-family: system-ui, sans-serif;
    z-index: 20; gap: 14px; transition: opacity 0.4s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading h1 { font-size: 1.1rem; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  #loading .bar-track { width: 240px; height: 6px; border-radius: 3px; background: #1c2330; overflow: hidden; }
  #loading .bar-fill { height: 100%; width: 0%; background: #5fb0ff; transition: width 0.2s ease; }
  #loading .hint { font-size: 0.75rem; color: #8a97ab; }

  #tap-to-start {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(10,14,20,0.55); color: #e8edf4; font-family: system-ui, sans-serif;
    font-size: 1rem; z-index: 15; text-align: center; padding: 24px; box-sizing: border-box;
  }
  body.desktop:not(.locked) #tap-to-start.ready { display: flex; }

  #label {
    position: fixed; left: 50%; bottom: 14%; transform: translateX(-50%);
    background: rgba(10,14,20,0.72); color: #e8edf4; font-family: system-ui, sans-serif;
    padding: 8px 16px; border-radius: 8px; font-size: 0.95rem; pointer-events: none;
    display: none; z-index: 5; white-space: nowrap;
  }
  #label.visible { display: block; }

  #joystick-zone, #look-zone {
    position: fixed; bottom: 0; width: 50%; height: 45%; z-index: 8; touch-action: none;
  }
  #joystick-zone { left: 0; }
  #look-zone { right: 0; }
  body.desktop #joystick-zone, body.desktop #look-zone { display: none; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="crosshair"></div>
  <div id="label"></div>
  <div id="joystick-zone"></div>
  <div id="look-zone"></div>

  <div id="tap-to-start" class="ready"><div>Click to look around<br /><span style="opacity:.7;font-size:.85rem">WASD / arrow keys to walk, Esc to release</span></div></div>

  <div id="loading">
    <h1>Meteo Instrument Walk</h1>
    <div class="bar-track"><div class="bar-fill" id="loading-bar"></div></div>
    <div class="hint" id="loading-hint">loading instruments&hellip;</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./assets/vendor/three/build/three.module.js",
      "three/addons/loaders/GLTFLoader.js": "./assets/vendor/three/examples/jsm/loaders/GLTFLoader.js",
      "three/addons/loaders/DRACOLoader.js": "./assets/vendor/three/examples/jsm/loaders/DRACOLoader.js",
      "three/addons/controls/PointerLockControls.js": "./assets/vendor/three/examples/jsm/controls/PointerLockControls.js",
      "three/addons/utils/BufferGeometryUtils.js": "./assets/vendor/three/examples/jsm/utils/BufferGeometryUtils.js"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
