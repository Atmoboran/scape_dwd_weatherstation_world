<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e14" />
<title>Meteo Instrument Walk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%235fb0ff'/%3E%3Ccircle cx='16' cy='14' r='7' fill='%23fff'/%3E%3Crect x='14' y='20' width='4' height='9' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root {
    --panel: rgba(12, 17, 25, 0.86);
    --panel-solid: #0d1219;
    --stroke: rgba(255, 255, 255, 0.14);
    --text: #eaf0f8;
    --muted: #93a2b8;
    --accent: #5fb0ff;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0e14;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text);
    overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }
  .hidden { display: none !important; }

  /* ---------- HUD ---------- */
  /* Above #touch-controls so the interact button isn't swallowed by the look zone;
     the container itself stays click-through. */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  #progress {
    position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px;
    background: var(--panel); border: 1px solid var(--stroke); border-radius: 12px;
    padding: 8px 12px; backdrop-filter: blur(8px); min-width: 132px;
  }
  #progress .label { font-size: 10px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }
  #progress .count { font-size: 19px; font-weight: 650; margin-top: 1px; }
  #progress .count small { font-size: 12px; color: var(--muted); font-weight: 500; }
  #progress .pips { display: flex; gap: 3px; margin-top: 6px; }
  #progress .pip { width: 12px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); }

  #minimap-wrap {
    position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px;
    background: var(--panel); border: 1px solid var(--stroke); border-radius: 12px;
    padding: 6px; backdrop-filter: blur(8px);
  }
  #minimap { display: block; width: 104px; height: 104px; }

  #settings-btn {
    position: absolute; top: calc(130px + env(safe-area-inset-top, 0px)); right: 12px;
    width: 46px; height: 46px; border-radius: 13px; pointer-events: auto; cursor: pointer;
    background: var(--panel); border: 1px solid var(--stroke); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; font-size: 20px; padding: 0;
  }
  #settings-panel {
    position: absolute; top: calc(184px + env(safe-area-inset-top, 0px)); right: 12px;
    width: 178px; background: var(--panel); border: 1px solid var(--stroke);
    border-radius: 14px; padding: 12px; backdrop-filter: blur(10px); pointer-events: auto;
    opacity: 0; transform: translateY(-6px) scale(0.97); transform-origin: top right;
    transition: opacity 0.18s, transform 0.18s; visibility: hidden;
  }
  #settings-panel.open { opacity: 1; transform: none; visibility: visible; }
  #settings-panel .title {
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 9px;
  }
  #weather-options { display: flex; flex-direction: column; gap: 5px; }
  #weather-options button {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px;
    border-radius: 9px; border: 1px solid transparent; background: rgba(255,255,255,0.06);
    color: var(--text); font: inherit; font-size: 13.5px; cursor: pointer; text-align: left;
  }
  #weather-options button.active { background: rgba(95,176,255,0.2); border-color: var(--accent); }

  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%; background: rgba(255,255,255,0.75); box-shadow: 0 0 0 1.5px rgba(0,0,0,0.35);
    opacity: 0; transition: opacity 0.2s;
  }
  body.locked #crosshair { opacity: 1; }

  #station-label {
    position: absolute; left: 50%; top: 16%; transform: translateX(-50%);
    text-align: center; opacity: 0; transition: opacity 0.18s; white-space: nowrap;
  }
  #station-label.visible { opacity: 1; }
  #station-label .name { font-size: 17px; font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
  #station-label .dist { font-size: 12px; color: var(--muted); text-shadow: 0 1px 6px rgba(0,0,0,0.6); }

  #interact {
    position: absolute; left: 50%; bottom: calc(26% + var(--safe-b)); transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--stroke); border-radius: 999px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; backdrop-filter: blur(8px);
    pointer-events: auto; opacity: 0; transition: opacity 0.18s; display: flex; align-items: center; gap: 8px;
  }
  #interact.visible { opacity: 1; }
  #interact kbd {
    background: rgba(255,255,255,0.14); border-radius: 5px; padding: 1px 6px;
    font: inherit; font-size: 12px; border: 1px solid var(--stroke);
  }

  #toast-stack {
    position: absolute; left: 50%; bottom: calc(42% + var(--safe-b)); transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  .toast {
    background: var(--panel); border: 1px solid var(--stroke); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 9px 16px; font-size: 14px; backdrop-filter: blur(8px);
    animation: toast-in 0.3s ease both; white-space: nowrap;
  }
  .toast.out { animation: toast-out 0.4s ease both; }
  .toast .sub { color: var(--muted); font-size: 12px; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(12px) scale(0.96); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(-8px); } }

  /* ---------- touch controls ---------- */
  #touch-controls { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  body:not(.touch) #touch-controls { display: none; }

  #joystick-zone, #look-zone {
    position: absolute; bottom: 0; height: 58%; pointer-events: auto; touch-action: none;
  }
  #joystick-zone { left: 0; width: 46%; }
  #look-zone { right: 0; width: 54%; }

  #joystick {
    position: absolute; left: 26px; bottom: calc(30px + var(--safe-b));
    width: 116px; height: 116px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
    border: 1.5px solid rgba(255,255,255,0.28); pointer-events: none;
    transition: opacity 0.2s; backdrop-filter: blur(3px);
  }
  #joystick::after {
    content: ''; position: absolute; inset: 0; margin: auto; width: 74px; height: 74px;
    border-radius: 50%; border: 1px dashed rgba(255,255,255,0.14);
  }
  #joystick-knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: rgba(255,255,255,0.82); box-shadow: 0 3px 14px rgba(0,0,0,0.45);
    transition: transform 0.06s linear;
  }
  #joystick-hint, #look-hint {
    position: absolute; font-size: 11px; color: rgba(255,255,255,0.75); letter-spacing: 0.06em;
    text-transform: uppercase; text-shadow: 0 1px 6px rgba(0,0,0,0.7); pointer-events: none;
    transition: opacity 0.5s;
  }
  #joystick-hint { left: 26px; bottom: calc(154px + var(--safe-b)); width: 116px; text-align: center; }
  #look-hint { right: 26px; bottom: calc(76px + var(--safe-b)); }
  .faded { opacity: 0 !important; }

  #sprint-btn {
    position: absolute; right: 22px; bottom: calc(112px + var(--safe-b));
    width: 62px; height: 62px; border-radius: 50%; pointer-events: auto;
    background: rgba(255,255,255,0.10); border: 1.5px solid rgba(255,255,255,0.28);
    display: flex; align-items: center; justify-content: center; font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.85);
    backdrop-filter: blur(3px);
  }
  #sprint-btn.active { background: rgba(95,176,255,0.35); border-color: var(--accent); }

  /* ---------- info panel ---------- */
  #info-panel {
    position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 110%);
    width: min(560px, 100%); background: var(--panel-solid); z-index: 12;
    border: 1px solid var(--stroke); border-bottom: none; border-radius: 18px 18px 0 0;
    padding: 18px 20px calc(22px + var(--safe-b)); transition: transform 0.28s cubic-bezier(.2,.8,.3,1);
    max-height: 72vh; overflow-y: auto; box-shadow: 0 -18px 50px rgba(0,0,0,0.5);
  }
  #info-panel.open { transform: translate(-50%, 0); }
  #info-panel .accent-bar { height: 3px; border-radius: 2px; background: var(--accent); margin-bottom: 14px; }
  #info-panel h2 { margin: 0 0 2px; font-size: 20px; font-weight: 650; }
  #info-panel .source { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  #info-panel p { margin: 0 0 14px; line-height: 1.55; font-size: 14.5px; color: #d6e0ee; }
  #info-panel .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  #info-panel .chip {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,0.07); border: 1px solid var(--stroke); color: #cfdaea;
  }
  #info-panel .stats { display: flex; gap: 20px; font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  #info-panel .stats b { display: block; color: var(--text); font-size: 15px; font-weight: 600; }
  #info-panel button {
    width: 100%; padding: 12px; border-radius: 11px; border: 1px solid var(--stroke);
    background: rgba(255,255,255,0.08); color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
  }

  /* ---------- overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 28px;
    background: radial-gradient(circle at 50% 35%, #16202e, #080b11 75%);
    transition: opacity 0.45s; gap: 18px;
  }
  .overlay.fade { opacity: 0; pointer-events: none; }
  .overlay h1 { margin: 0; font-size: clamp(24px, 6vw, 36px); font-weight: 680; letter-spacing: -0.01em; }
  .overlay .tag { color: var(--muted); font-size: 14px; max-width: 34ch; line-height: 1.5; margin: -8px 0 0; }

  #loading .bar-track { width: 220px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
  #loading .bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.25s ease; }
  #loading .hint { font-size: 12px; color: var(--muted); }

  #start .keys { display: flex; flex-direction: column; gap: 10px; margin: 4px 0 6px; }
  #start .row { display: flex; align-items: center; gap: 10px; justify-content: center; font-size: 13.5px; color: #c9d5e5; }
  #start .row .k {
    min-width: 30px; padding: 4px 8px; border-radius: 7px; background: rgba(255,255,255,0.1);
    border: 1px solid var(--stroke); font-size: 12px; font-weight: 600;
  }
  #start .go {
    margin-top: 6px; padding: 14px 38px; border-radius: 999px; border: none; cursor: pointer;
    background: var(--accent); color: #05121f; font: inherit; font-size: 16px; font-weight: 700;
    box-shadow: 0 8px 26px rgba(95,176,255,0.35);
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="progress">
      <div class="label">Stations found</div>
      <div class="count"><span id="found-count">0</span><small> / <span id="total-count">0</span></small></div>
      <div class="pips" id="pips"></div>
    </div>

    <div id="minimap-wrap"><canvas id="minimap" width="208" height="208"></canvas></div>

    <button id="settings-btn" type="button" aria-label="Weather settings">&#9925;</button>
    <div id="settings-panel">
      <div class="title">Weather</div>
      <div id="weather-options"></div>
    </div>

    <div id="crosshair"></div>

    <div id="station-label">
      <div class="name"></div>
      <div class="dist"></div>
    </div>

    <div id="toast-stack"></div>

    <div id="interact"><span class="verb">Inspect</span><kbd>E</kbd></div>
  </div>

  <div id="touch-controls">
    <div id="joystick-zone"></div>
    <div id="look-zone"></div>
    <div id="joystick"><div id="joystick-knob"></div></div>
    <div id="joystick-hint">Drag to walk</div>
    <div id="look-hint">Drag here to look</div>
    <div id="sprint-btn">Run</div>
  </div>

  <div id="info-panel">
    <div class="accent-bar"></div>
    <h2></h2>
    <div class="source"></div>
    <p></p>
    <div class="chips"></div>
    <div class="stats"></div>
    <button type="button">Close</button>
  </div>

  <div id="start" class="overlay hidden">
    <h1>Meteo Instrument Walk</h1>
    <p class="tag">Eight meteorological stations, scanned from CAD and dropped into a field. Walk the row and inspect every one.</p>
    <div class="keys" id="control-help"></div>
    <button class="go" type="button">Enter the field</button>
  </div>

  <div id="loading" class="overlay">
    <h1>Meteo Instrument Walk</h1>
    <div class="bar-track"><div class="bar-fill" id="loading-bar"></div></div>
    <div class="hint" id="loading-hint">preparing the field&hellip;</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./assets/vendor/three/build/three.module.js",
      "three/addons/loaders/GLTFLoader.js": "./assets/vendor/three/examples/jsm/loaders/GLTFLoader.js",
      "three/addons/loaders/DRACOLoader.js": "./assets/vendor/three/examples/jsm/loaders/DRACOLoader.js",
      "three/addons/controls/PointerLockControls.js": "./assets/vendor/three/examples/jsm/controls/PointerLockControls.js",
      "three/addons/utils/BufferGeometryUtils.js": "./assets/vendor/three/examples/jsm/utils/BufferGeometryUtils.js"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
